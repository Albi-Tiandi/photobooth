<svg xmlns="http://www.w3.org/2000/svg" width="900" height="2700" viewBox="0 0 900 2700">
  <defs>
    <mask id="windows" maskUnits="userSpaceOnUse" x="0" y="0" width="900" height="2700">
      <rect width="900" height="2700" fill="#ffffff"/>
      <rect x="60" y="80" width="780" height="540" rx="14" fill="#000000"/>
      <rect x="60" y="660" width="780" height="540" rx="14" fill="#000000"/>
      <rect x="60" y="1240" width="780" height="540" rx="14" fill="#000000"/>
      <rect x="60" y="1820" width="780" height="540" rx="14" fill="#000000"/>
    </mask>

    <pattern id="buttergingham" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="#fff3c9"/>
      <rect width="30" height="60" fill="#f7df9d" opacity="0.8"/>
      <rect width="60" height="30" fill="#ffffff" opacity="0.45"/>
    </pattern>

    <pattern id="butterstripes" width="60" height="2700" patternUnits="userSpaceOnUse">
      <rect width="60" height="2700" fill="#fffaef"/>
      <rect width="30" height="2700" fill="#fdf1d4"/>
      <rect x="32" width="2" height="2700" fill="#e7a45e"/>
      <rect x="38" width="1" height="2700" fill="#e7a45e" opacity="0.6"/>
    </pattern>

    <path id="star4" d="M0 -44 L10 -10 L44 0 L10 10 L0 44 L-10 10 L-44 0 L-10 -10 Z"/>

    <g id="cherry">
      <path d="M -2 6 C -10 -34 -34 -50 -50 -56" fill="none" stroke="#4f7a3a" stroke-width="6" stroke-linecap="round"/>
      <path d="M 14 8 C 18 -26 42 -46 60 -60" fill="none" stroke="#4f7a3a" stroke-width="6" stroke-linecap="round"/>
      <path d="M -48 -56 q 32 -24 60 -6 q -22 28 -60 6 Z" fill="#6a9a4f"/>
      <circle cx="-50" cy="2" r="26" fill="#d64045"/>
      <circle cx="22" cy="10" r="26" fill="#c53030"/>
      <circle cx="-58" cy="-6" r="7" fill="#ffffff" opacity="0.45"/>
      <circle cx="14" cy="2" r="7" fill="#ffffff" opacity="0.45"/>
    </g>
  </defs>

  <g mask="url(#windows)">
    <rect width="900" height="2700" fill="#fff3c9"/>
    <rect x="0" y="0" width="452" height="2700" fill="url(#buttergingham)"/>
    <rect x="452" y="0" width="448" height="2700" fill="url(#butterstripes)"/>
    <rect x="447" y="0" width="8" height="2380" fill="#8a4a2b"/>
    <line x1="436" y1="0" x2="436" y2="2380" stroke="#fff7e6" stroke-width="2" stroke-dasharray="10 12" opacity="0.7"/>

    <g fill="#8a4a2b">
      <rect x="46" y="66" width="808" height="568" rx="20"/>
      <rect x="46" y="646" width="808" height="568" rx="20"/>
      <rect x="46" y="1226" width="808" height="568" rx="20"/>
      <rect x="46" y="1806" width="808" height="568" rx="20"/>
    </g>
  </g>

  <g fill="none" stroke="#fff7e6" stroke-width="2.5">
