    <line x1="362" y1="66" x2="538" y2="66" stroke="#d9a45e" stroke-width="2" stroke-dasharray="6 6"/>
    <line x1="362" y1="92" x2="538" y2="92" stroke="#d9a45e" stroke-width="2" stroke-dasharray="6 6"/>
