  <text x="450" y="2650" text-anchor="middle" font-family="Poppins, 'Segoe UI', sans-serif" font-size="44" font-weight="700" letter-spacing="1.5" fill="#7c2d12">(picnic) (on) (film)</text>
  <use href="#star4" transform="translate(262 2636) scale(0.18)" fill="#d64045"/>
  <use href="#star4" transform="translate(638 2636) scale(0.18)" fill="#d64045"/>
