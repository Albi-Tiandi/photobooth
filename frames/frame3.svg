  <use href="#cherry" transform="translate(792 742) rotate(-8) scale(0.95)"/>
  <use href="#cherry" transform="translate(136 2282) rotate(10) scale(0.8)"/>
  <use href="#cherry" transform="translate(780 1668) rotate(14) scale(0.42)"/>

  <use href="#star4" transform="translate(118 1288) rotate(-14) scale(0.5)" fill="#e08a3c"/>
  <use href="#star4" transform="translate(790 930) rotate(16) scale(0.38)" fill="#e08a3c"/>

  <g transform="rotate(-4 450 80)">
