<svg xmlns="http://www.w3.org/2000/svg" width="900" height="2700" viewBox="0 0 900 2700">
  <defs>
    <mask id="windows" maskUnits="userSpaceOnUse" x="0" y="0" width="900" height="2700">
      <rect width="900" height="2700" fill="#ffffff"/>
      <rect x="60" y="80" width="780" height="540" rx="14" fill="#000000"/>
      <rect x="60" y="660" width="780" height="540" rx="14" fill="#000000"/>
      <rect x="60" y="1240" width="780" height="540" rx="14" fill="#000000"/>
      <rect x="60" y="1820" width="780" height="540" rx="14" fill="#000000"/>
    </mask>

    <pattern id="mintgingham" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="#e2f3e8"/>
      <rect width="32" height="64" fill="#c9e9d6" opacity="0.75"/>
      <rect width="64" height="32" fill="#ffffff" opacity="0.35"/>
    </pattern>

    <pattern id="mintstripes" width="54" height="2700" patternUnits="userSpaceOnUse">
      <rect width="54" height="2700" fill="#fdfbf3"/>
      <rect width="26" height="2700" fill="#e4f4ea"/>
      <rect x="28" width="2" height="2700" fill="#b9ddc8"/>
    </pattern>

    <path id="star4" d="M0 -44 L10 -10 L44 0 L10 10 L0 44 L-10 10 L-44 0 L-10 -10 Z"/>

    <g id="daisy">
      <g fill="#fffdf7">
        <ellipse cx="0" cy="-34" rx="13" ry="28"/>
        <ellipse cx="0" cy="-34" rx="13" ry="28" transform="rotate(60)"/>
        <ellipse cx="0" cy="-34" rx="13" ry="28" transform="rotate(120)"/>
        <ellipse cx="0" cy="-34" rx="13" ry="28" transform="rotate(180)"/>
        <ellipse cx="0" cy="-34" rx="13" ry="28" transform="rotate(240)"/>
        <ellipse cx="0" cy="-34" rx="13" ry="28" transform="rotate(300)"/>
      </g>
      <circle r="16" fill="#f2c94c"/>
      <circle r="16" fill="none" stroke="#d9a925" stroke-width="2" opacity="0.5"/>
    </g>
  </defs>

  <g mask="url(#windows)">
    <rect width="900" height="2700" fill="#d9efe2"/>
    <rect x="0" y="0" width="452" height="2700" fill="url(#mintgingham)"/>
    <rect x="452" y="0" width="448" height="2700" fill="url(#mintstripes)"/>
    <rect x="448" y="0" width="7" height="2380" fill="#2f6f5c"/>
    <line x1="436" y1="0" x2="436" y2="2380" stroke="#fffdf7" stroke-width="2" stroke-dasharray="10 12" opacity="0.7"/>

    <g fill="#2f6f5c">
      <rect x="46" y="66" width="808" height="568" rx="20"/>
      <rect x="46" y="646" width="808" height="568" rx="20"/>
      <rect x="46" y="1226" width="808" height="568" rx="20"/>
      <rect x="46" y="1806" width="808" height="568" rx="20"/>
    </g>
  </g>

  <g fill="none" stroke="#fdfbf4" stroke-width="2.5">
    <rect x="60" y="80" width="780" height="540" rx="14"/>
    <rect x="60" y="660" width="780" height="540" rx="14"/>
    <rect x="60" y="1240" width="780" height="540" rx="14"/>
    <rect x="60" y="1820" width="780" height="540" rx="14"/>
  </g>

  <g transform="rotate(-3 450 82)">
    <rect x="356" y="56" width="188" height="46" rx="8" fill="#fdfbf4" opacity="0.9"/>
    <line x1="366" y1="66" x2="534" y2="66" stroke="#8fc6ad" stroke-width="2" stroke-dasharray="6 6" opacity="0.8"/>
    <line x1="366" y1="92" x2="534" y2="92" stroke="#8fc6ad" stroke-width="2" stroke-dasharray="6 6" opacity="0.8"/>
  </g>

  <use href="#daisy" transform="translate(112 155) scale(1.05)"/>
  <path d="M 196 214 q 30 -34 62 -12 q -16 38 -62 12 Z" fill="#7fbf9b"/>
  <path d="M 188 228 q 20 -8 34 -30" fill="none" stroke="#5c9c7c" stroke-width="3" stroke-linecap="round"/>

  <use href="#daisy" transform="translate(795 1248) scale(0.75) rotate(22)"/>
  <use href="#daisy" transform="translate(120 2196) scale(0.65) rotate(-16)"/>
  <use href="#daisy" transform="translate(788 1668) scale(0.5) rotate(10)"/>

  <use href="#star4" transform="translate(800 928) rotate(12) scale(0.45)" fill="#2f7f68"/>
  <use href="#star4" transform="translate(124 1740) rotate(-8) scale(0.35)" fill="#2f7f68"/>
  <use href="#star4" transform="translate(792 2252) rotate(20) scale(0.3)" fill="#2f7f68"/>

  <text x="450" y="2650" text-anchor="middle" font-family="Poppins, 'Segoe UI', sans-serif" font-size="44" font-weight="700" letter-spacing="1.5" fill="#1e4d3f">(fresh) (on) (film)</text>
</svg>
