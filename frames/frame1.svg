      <rect x="60" y="80" width="780" height="540" rx="14" fill="#000000"/>
      <rect x="60" y="660" width="780" height="540" rx="14" fill="#000000"/>
      <rect x="60" y="1240" width="780" height="540" rx="14" fill="#000000"/>
