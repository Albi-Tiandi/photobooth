<svg xmlns="http://www.w3.org/2000/svg" width="900" height="2700" viewBox="0 0 900 2700">
  <defs>
    <mask id="windows" maskUnits="userSpaceOnUse" x="0" y="0" width="900" height="2700">
      <rect width="900" height="2700" fill="#ffffff"/>
      <rect x="60" y="80" width="780" height="540" rx="14" fill="#000000"/>
      <rect x="60" y="660" width="780" height="540" rx="14" fill="#000000"/>
      <rect x="60" y="1240" width="780" height="540" rx="14" fill="#000000"/>
      <rect x="60" y="1820" width="780" height="540" rx="14" fill="#000000"/>
    </mask>

    <pattern id="nightdots" width="90" height="90" patternUnits="userSpaceOnUse">
      <rect width="90" height="90" fill="#1e2a47"/>
      <circle cx="18" cy="24" r="2" fill="#fbbf24" opacity="0.5"/>
      <circle cx="62" cy="66" r="1.6" fill="#fef3c7" opacity="0.4"/>
      <circle cx="74" cy="18" r="1.2" fill="#fbbf24" opacity="0.35"/>
      <circle cx="38" cy="84" r="1.1" fill="#fef3c7" opacity="0.28"/>
    </pattern>

    <pattern id="nightstripes" width="64" height="2700" patternUnits="userSpaceOnUse">
      <rect width="64" height="2700" fill="#25345a"/>
      <rect width="30" height="2700" fill="#1a2540"/>
      <rect x="32" width="2" height="2700" fill="#3a4a72"/>
      <rect x="54" width="6" height="2700" fill="#2c3b62"/>
    </pattern>

    <path id="star5" d="M0 -90 L21.2 -29.1 L85.6 -27.8 L34.2 11.1 L52.9 72.8 L0 36 L-52.9 72.8 L-34.2 11.1 L-85.6 -27.8 L-21.2 -29.1 Z"/>
    <path id="star4" d="M0 -44 L10 -10 L44 0 L10 10 L0 44 L-10 10 L-44 0 L-10 -10 Z"/>
    <path id="moon" d="M 0 -50 A 50 50 0 1 0 0 50 A 40 40 0 1 1 0 -50 Z"/>
  </defs>

  <g mask="url(#windows)">
    <rect width="900" height="2700" fill="#1e2a47"/>
    <rect x="0" y="0" width="452" height="2700" fill="url(#nightdots)"/>
    <rect x="452" y="0" width="448" height="2700" fill="url(#nightstripes)"/>
    <rect x="448" y="0" width="7" height="2380" fill="#fef3c7"/>
    <line x1="436" y1="0" x2="436" y2="2380" stroke="#fef3c7" stroke-width="2" stroke-dasharray="8 14" opacity="0.4"/>

    <g fill="#fef3c7">
      <rect x="46" y="66" width="808" height="568" rx="20"/>
      <rect x="46" y="646" width="808" height="568" rx="20"/>
      <rect x="46" y="1226" width="808" height="568" rx="20"/>
      <rect x="46" y="1806" width="808" height="568" rx="20"/>
    </g>
  </g>

  <g fill="none" stroke="#fef3c7" stroke-width="2" opacity="0.6">
    <rect x="60" y="80" width="780" height="540" rx="14"/>
    <rect x="60" y="660" width="780" height="540" rx="14"/>
    <rect x="60" y="1240" width="780" height="540" rx="14"/>
    <rect x="60" y="1820" width="780" height="540" rx="14"/>
  </g>

  <use href="#star5" transform="translate(800 150) rotate(12) scale(0.95)" fill="#fbbf24"/>
  <use href="#star5" transform="translate(800 150) rotate(12) scale(0.34)" fill="#1e2a47"/>

  <use href="#moon" transform="translate(126 1280) rotate(-16) scale(0.9)" fill="#fbbf24"/>

  <use href="#star4" transform="translate(800 928) rotate(14) scale(0.5)" fill="#fbbf24"/>
  <use href="#star4" transform="translate(118 1732) rotate(-10) scale(0.42)" fill="#fef3c7" opacity="0.9"/>
  <use href="#star4" transform="translate(792 2252) rotate(18) scale(0.58)" fill="#fbbf24"/>
  <use href="#star4" transform="translate(430 58) rotate(8) scale(0.3)" fill="#fef3c7" opacity="0.8"/>
  <use href="#star4" transform="translate(790 1688) rotate(-6) scale(0.26)" fill="#fef3c7" opacity="0.85"/>

  <text x="450" y="2650" text-anchor="middle" font-family="Poppins, 'Segoe UI', sans-serif" font-size="44" font-weight="700" letter-spacing="1.5" fill="#fef3c7">(night) (on) (film)</text>
  <use href="#star4" transform="translate(262 2636) scale(0.18)" fill="#fbbf24"/>
  <use href="#star4" transform="translate(638 2636) scale(0.18)" fill="#fbbf24"/>
</svg>
